<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>localsend-nas</title>
<script>
// Anti-FOUC: apply the persisted/system theme before first paint.
// Mirrors initTheme() in app.js — keep both in sync.
(function(){try{
  var t=localStorage.getItem("localsend-nas-theme")||"system";
  var d=t==="dark"||(t==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  var r=document.documentElement;
  if(d){r.classList.add("dark");}
  r.style.colorScheme=d?"dark":"light";
  var m=document.querySelector('meta[name="theme-color"]');
  if(m){m.content=d?"#161a22":"#f6f7f9";}
}catch(e){}})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="brand">
    <img src="favicon.png" width="26" height="26" alt="localsend-nas logo">
    <h1>localsend-nas</h1>
  </span>
  <nav id="tabs">
    <button data-tab="files" class="active">Files</button>
    <button data-tab="devices">Devices</button>
    <button data-tab="transfers">Transfers<span id="transferBadge"></span></button>
  </nav>
  <button id="themeToggle" title="Theme: system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></button>
</header>

<main>
  <section id="tab-files">
    <div class="toolbar">
      <label>Share <select id="shareSelect"></select></label>
      <span id="breadcrumb"></span>
    </div>
    <table id="fileList">
      <thead><tr><th class="check"></th><th>Name</th><th class="num">Size</th><th>Modified</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="basketBar">
      <span id="basketInfo">Basket empty</span>
      <span class="spacer"></span>
      <button id="clearBasket" class="secondary">Clear</button>
      <button id="chooseDevice">Choose device →</button>
    </div>
  </section>

  <section id="tab-devices" hidden>
    <div class="toolbar">
      <input id="addrInput" type="text" placeholder="Add device by IP[:port]" spellcheck="false">
      <button id="addDevice">Add</button>
      <button id="refreshDevices" class="secondary">Refresh</button>
    </div>
    <ul id="deviceList" class="cards"></ul>
  </section>

  <section id="tab-transfers" hidden>
    <ul id="transferList" class="cards"></ul>
  </section>
</main>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
